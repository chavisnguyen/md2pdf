name: Release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - version matches tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          grep -E "^VERSION=\"${VERSION}\"" md2pdf
          chmod +x md2pdf md2pdf.sh
          ./md2pdf --version | grep -F "$VERSION"
      - name: Package archives & checksums
        run: |
          mkdir -p release-assets staging
          cp md2pdf style.css LICENSE staging/
          chmod 0755 staging/md2pdf
          for t in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            tar -czf "release-assets/md2pdf-${t}.tar.gz" -C staging md2pdf style.css LICENSE
          done
          (cd release-assets && sha256sum md2pdf-*.tar.gz > checksums.txt && cat checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "md2pdf $TAG" --generate-notes
          gh release upload "$TAG" release-assets/* --clobber
      - name: Bump Formula/md2pdf.rb
        run: |
          git checkout "${{ github.event.repository.default_branch }}"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$TAG" python3 - << 'PYEOF'
          import os, re

          sums = {}
          for line in open("release-assets/checksums.txt"):
              parts = line.split()
              if len(parts) >= 2:
                  sums[parts[1]] = parts[0]

          p = "Formula/md2pdf.rb"
          s = open(p).read()
          tag = os.environ["TAG"]
          for name, sha in sums.items():
              s = re.sub(
                  r"https://github\.com/chavisnguyen/md2pdf/releases/download/[^/\"']+/" + re.escape(name),
                  f"https://github.com/chavisnguyen/md2pdf/releases/download/{tag}/{name}",
                  s,
              )
              s = re.sub(r'(' + re.escape(name) + r'"\n\s*sha256 ")[0-9a-f]{64}', rf"\g<1>{sha}", s)
          open(p, "w").write(s)
          PYEOF

          git diff --stat
          git add Formula/md2pdf.rb
          git -c "user.name=md2pdf-bot" -c "user.email=md2pdf-bot@users.noreply.github.com" \
            commit -m "chore(formula): bump to ${TAG}" && git push || echo "nothing to bump"
